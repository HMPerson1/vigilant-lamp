<div class="canvas-box" style="width: 100%; height: 100%;" [style.transform]="viewport.viewportTransform()">
  <canvas #canvas></canvas>
</div>

@if (_showOvertones$()) {
  <div class="overtone-container" [style.transform]="overtoneContainerTransform()">
    @for (o of overtoneYOffsets(); track $index; let idx = $index) {
      <div class="crosshair" style="height: 1px"
      [style.opacity]=".7-idx*.05" [style.transform]="o"></div>
    }
  </div>
}
